<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <link rel="icon" type="image/x-icon" href="/favicon.ico">
  <link rel="icon" type="image/png" sizes="32x32" href="/favicon-32x32.png">
  <link rel="icon" type="image/png" sizes="16x16" href="/favicon-16x16.png">
  <link rel="apple-touch-icon" sizes="180x180" href="/apple-touch-icon.png">

  <title>Shared from grovio</title>

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Nunito:wght@800&display=swap" rel="stylesheet">

  <!-- Generic Grovio metadata only. Private homeschool portfolios must NEVER
       surface learner names or photo content in social previews. -->
  <meta name="description" content="Someone shared their homeschool story with you.">
  <meta property="og:type" content="website">
  <meta property="og:site_name" content="grovio">
  <meta property="og:title" content="grovio — The Calm Homeschool Planner App">
  <meta property="og:description" content="Someone shared their homeschool story with you.">
  <meta property="og:image" content="https://grovioapp.com/og-image.png">
  <meta property="og:url" content="https://grovioapp.com">
  <meta name="twitter:card" content="summary_large_image">
  <meta name="twitter:title" content="grovio — The Calm Homeschool Planner App">
  <meta name="twitter:description" content="Someone shared their homeschool story with you.">
  <meta name="twitter:image" content="https://grovioapp.com/og-image.png">
  <meta name="robots" content="noindex, nofollow">

  <style>
    html, body { margin: 0; padding: 0; min-height: 100%; background: #F7F4EE; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      color: #5C4A3A;
      -webkit-font-smoothing: antialiased;
      -moz-osx-font-smoothing: grayscale;
    }
    * { box-sizing: border-box; }

    .top-bar {
      padding: 18px 24px;
      border-bottom: 1px solid rgba(92, 74, 58, 0.08);
      background: #F7F4EE;
    }
    .wordmark {
      font-family: 'Nunito', sans-serif;
      font-weight: 800;
      font-size: 26px;
      color: #4A6E4E;
      letter-spacing: -0.02em;
      text-transform: lowercase;
      line-height: 1;
    }

    .hero {
      max-width: 680px;
      margin: 0 auto;
      padding: 40px 24px 28px;
      text-align: center;
    }
    .avatar {
      width: 72px;
      height: 72px;
      border-radius: 50%;
      color: #fff;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 30px;
      font-weight: 700;
      margin: 0 auto 20px;
      box-shadow: 0 4px 16px rgba(0, 0, 0, 0.12);
    }
    .hero h1 {
      font-family: Georgia, serif;
      font-size: 28px;
      font-style: italic;
      color: #5C4A3A;
      margin: 0 0 10px;
      line-height: 1.25;
      font-weight: 400;
    }
    .hero-meta {
      font-size: 14px;
      color: #8C7B6B;
      line-height: 1.6;
    }
    .hero-meta-sep { padding: 0 6px; color: #C4B8A8; }

    .divider-wrap {
      max-width: 680px;
      margin: 0 auto 28px;
      padding: 0 24px;
    }
    .divider {
      height: 1px;
      background: rgba(92, 74, 58, 0.1);
    }

    .cards-wrap {
      max-width: 680px;
      margin: 0 auto;
      padding: 0 16px 40px;
    }
    .card {
      background: #fff;
      border-radius: 18px;
      border: 1px solid rgba(92, 74, 58, 0.1);
      box-shadow: 0 2px 12px rgba(92, 74, 58, 0.07);
      margin-bottom: 16px;
      overflow: hidden;
    }
    .card-photo {
      aspect-ratio: 4 / 5;
      width: 100%;
      position: relative;
      overflow: hidden;
      background: #EBF3EC;
    }
    .card-photo img {
      position: absolute;
      inset: 0;
      width: 100%;
      height: 100%;
      display: block;
      object-fit: cover;
      opacity: 0;
      transition: opacity 0.2s ease;
    }
    .card-emoji-tile {
      width: 64px;
      height: 64px;
      margin: 16px 16px 0;
      border-radius: 14px;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 28px;
    }
    .card-body { padding: 12px 16px 14px; }
    .card-title {
      font-family: Georgia, serif;
      font-size: 15px;
      font-weight: 700;
      color: #5C4A3A;
      margin-bottom: 6px;
      line-height: 1.3;
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
    }
    .card-desc {
      font-size: 13px;
      color: #7A6858;
      line-height: 1.6;
      margin-bottom: 8px;
    }
    .card-meta {
      display: flex;
      gap: 8px;
      flex-wrap: wrap;
      align-items: center;
    }
    .subject-pill {
      font-size: 11px;
      font-weight: 600;
      padding: 3px 9px;
      border-radius: 20px;
    }
    .card-date {
      font-size: 11px;
      color: #9E8E7E;
      margin-left: auto;
    }

    .empty {
      text-align: center;
      padding: 32px 0;
      color: #8C7B6B;
      font-style: italic;
    }

    /* Error / loading shared block */
    .center {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      min-height: 50vh;
      text-align: center;
      padding: 0 24px;
    }

    .skeleton {
      background: linear-gradient(90deg, #ECE5D8 0%, #F5EFE2 50%, #ECE5D8 100%);
      background-size: 200% 100%;
      animation: shimmer 1.4s ease-in-out infinite;
      border-radius: 8px;
    }
    @keyframes shimmer {
      0% { background-position: 200% 0; }
      100% { background-position: -200% 0; }
    }
    .skeleton-avatar { width: 72px; height: 72px; border-radius: 36px; margin: 0 auto 12px; }
    .skeleton-line { height: 14px; max-width: 220px; margin: 8px auto; border-radius: 6px; }
    .skeleton-line.lg { height: 28px; max-width: 320px; }
    .skeleton-card { width: 100%; aspect-ratio: 4 / 5; border-radius: 18px; margin-bottom: 16px; }

    /* Waitlist CTA */
    .cta-section {
      background: #F7F4EE;
      border-top: 1px solid #E8DFD2;
      padding: 32px 20px;
      margin-top: 40px;
      text-align: center;
    }
    .cta-inner { max-width: 480px; margin: 0 auto; }
    .cta-headline {
      font-family: Georgia, serif;
      font-style: italic;
      font-size: 24px;
      color: #4A6E4E;
      margin-bottom: 12px;
      line-height: 1.3;
    }
    .cta-body {
      font-size: 15px;
      color: #5C4A3A;
      line-height: 1.6;
      margin-bottom: 24px;
    }
    .cta-btn {
      background: #4A6E4E;
      color: #fff;
      border: none;
      padding: 14px 32px;
      border-radius: 12px;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      font-size: 15px;
      font-weight: 500;
      cursor: pointer;
    }
    .cta-btn:hover { background: #3F5F42; }

    .footer {
      text-align: center;
      padding: 28px 24px 40px;
      border-top: 1px solid rgba(92, 74, 58, 0.08);
      margin-top: 8px;
    }
    .footer-text {
      font-size: 13px;
      color: #9E8E7E;
      line-height: 1.7;
    }
    .footer-text strong { color: #4A6E4E; }
    .footer-text a {
      font-size: 12px;
      color: #4A6E4E;
      text-decoration: none;
      font-weight: 500;
    }
  </style>
</head>
<body>
  <div class="top-bar"><span class="wordmark">grovio</span></div>

  <main id="content"></main>

  <!-- Download CTA always present (loading, content, error) -->
  <section class="cta-section">
    <div class="cta-inner">
      <div class="cta-headline">Capture your homeschool, your way.</div>
      <div class="cta-body">
        grovio helps homeschool moms record attendance, save portfolio moments,
        and reflect on the week — all in one quiet app.
      </div>
      <a class="cta-btn" href="/get" style="text-decoration:none;display:inline-block;">Download free &rarr;</a>
      <div style="font-size:12px;color:#9A8C6E;margin-top:10px;font-family:'Plus Jakarta Sans',sans-serif;">Available on iOS and Android.</div>
    </div>
  </section>

  <footer class="footer">
    <div class="footer-text">
      Made with <strong>grovio</strong><br>
      <span>Grow Simply. Homeschool Confidently.</span><br>
      <a href="https://grovioapp.com">grovioapp.com</a>
    </div>
  </footer>


  <script>
    // Mirrors COLORS from grovio-app/src/lib/constants.js. 'sage' is no longer
    // in the palette so it falls back to sky — matches the React component.
    var COLORS = {
      sky:   { bg: '#4A8FA0', light: '#EBF4F6' },
      clay:  { bg: '#C4845A', light: '#FAF0E8' },
      amber: { bg: '#C4843A', light: '#FBF3E4' },
      rose:  { bg: '#B06080', light: '#F8EEF3' },
      bark:  { bg: '#5C4A3A', light: '#F5F0EB' }
    };
    var FALLBACK_COLOR = 'sky';

    function escapeHtml(str) {
      if (str == null) return '';
      return String(str).replace(/[&<>"']/g, function(c) {
        return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c];
      });
    }

    function formatDate(ds, opts) {
      if (!ds) return null;
      try {
        return new Date(ds + 'T12:00:00').toLocaleDateString('en-US', opts);
      } catch (e) { return null; }
    }

    function renderLoading() {
      document.getElementById('content').innerHTML =
        '<div style="max-width:680px;margin:0 auto;padding:40px 24px 28px;display:flex;flex-direction:column;align-items:center;gap:12px;">' +
          '<div class="skeleton skeleton-avatar"></div>' +
          '<div class="skeleton skeleton-line lg" style="width:60%;"></div>' +
          '<div class="skeleton skeleton-line" style="width:40%;"></div>' +
        '</div>' +
        '<div style="max-width:680px;margin:0 auto;padding:0 16px 40px;">' +
          '<div class="skeleton skeleton-card"></div>' +
          '<div class="skeleton skeleton-card"></div>' +
        '</div>';
    }

    function renderError(kind) {
      var html;
      if (kind === 'deactivated') {
        html =
          '<div class="center">' +
            '<div style="font-size:40px;margin-bottom:16px;">🔒</div>' +
            '<div style="font-family:Georgia,serif;font-size:20px;color:#2C2218;margin-bottom:8px;">' +
              'This link is no longer active.' +
            '</div>' +
            '<div style="font-size:14px;color:#7A6A5A;line-height:1.6;max-width:380px;">' +
              'Ask the person who sent it for a fresh link.' +
            '</div>' +
          '</div>';
      } else {
        html =
          '<div class="center">' +
            '<div style="font-size:32px;margin-bottom:12px;">🌱</div>' +
            '<div style="font-family:Georgia,serif;font-size:18px;color:#5C4A3A;margin-bottom:8px;font-style:italic;">' +
              "This portfolio isn't available." +
            '</div>' +
            '<div style="font-size:14px;color:#8C7B6B;line-height:1.6;max-width:380px;">' +
              'The link may have expired or been removed.' +
            '</div>' +
          '</div>';
      }
      document.getElementById('content').innerHTML = html;
    }

    function renderContent(data) {
      var learner = data.learner || {};
      var portfolio = (data.portfolio || []).filter(function(p) { return p && p.id; });
      var hsName = data.hsName || 'Our Homeschool';
      var clr = COLORS[learner.color] || COLORS[FALLBACK_COLOR];
      var initial = (learner.name || '?').charAt(0).toUpperCase();

      // Date range
      var dates = portfolio.map(function(e) { return e.date; }).filter(Boolean).sort();
      var firstDate = dates[0];
      var lastDate = dates[dates.length - 1];
      var fmt = function(d) { return formatDate(d, { month: 'long', year: 'numeric' }); };
      var rangeLabel = (firstDate && lastDate && firstDate !== lastDate)
        ? (fmt(firstDate) + ' – ' + fmt(lastDate))
        : (firstDate ? fmt(firstDate) : null);

      var hero =
        '<div class="hero">' +
          '<div class="avatar" style="background:' + clr.bg + ';">' + escapeHtml(initial) + '</div>' +
          '<h1>' + escapeHtml(learner.name || 'Their') + "'s Learning Journey</h1>" +
          '<div class="hero-meta">' +
            escapeHtml(hsName) +
            (rangeLabel ? '<span class="hero-meta-sep">·</span>' + escapeHtml(rangeLabel) : '') +
            (portfolio.length > 0
              ? '<span class="hero-meta-sep">·</span>' + portfolio.length + ' moment' + (portfolio.length !== 1 ? 's' : '')
              : '') +
          '</div>' +
        '</div>' +
        '<div class="divider-wrap"><div class="divider"></div></div>';

      var cardsHtml;
      if (portfolio.length === 0) {
        cardsHtml = '<div class="empty">Nothing here yet.</div>';
      } else {
        cardsHtml = portfolio.map(function(p) {
          var photo = p.photo;
          var desc = p.desc;
          var dateLabel = formatDate(p.date, { month: 'short', day: 'numeric', year: 'numeric' }) || '';
          var photoBlock = photo
            ? '<div class="card-photo">' +
                '<img src="' + escapeHtml(photo) + '" alt="" loading="lazy" decoding="async" ' +
                'onload="this.style.opacity=1">' +
              '</div>'
            : '<div class="card-emoji-tile" style="background:' + clr.light + ';">' +
                escapeHtml(p.emoji || '📝') +
              '</div>';
          var subjectPill = p.subject
            ? '<span class="subject-pill" style="background:' + clr.light + ';color:' + clr.bg + ';">' +
                escapeHtml(p.subject) +
              '</span>'
            : '';
          return '<div class="card" style="border-left:4px solid ' + clr.bg + ';">' +
            photoBlock +
            '<div class="card-body">' +
              '<div class="card-title">' + escapeHtml(p.title || '') + '</div>' +
              (desc ? '<div class="card-desc">' + escapeHtml(desc) + '</div>' : '') +
              '<div class="card-meta">' +
                subjectPill +
                '<span class="card-date">' + escapeHtml(dateLabel) + '</span>' +
              '</div>' +
            '</div>' +
          '</div>';
        }).join('');
      }

      document.getElementById('content').innerHTML =
        hero + '<div class="cards-wrap">' + cardsHtml + '</div>';
    }

    async function load() {
      // Token sits at the end of the path. Rewrite /share/:token → /share.html
      // preserves the original path, so location.pathname still reads /share/<token>.
      var pathParts = window.location.pathname.split('/').filter(Boolean);
      var token = pathParts[pathParts.length - 1];

      // No token, or path is literally /share/ or /share — render error immediately.
      if (!token || token === 'share' || token === 'share.html') {
        renderError('notfound');
        return;
      }

      renderLoading();

      try {
        var res = await fetch(
          'https://trqqcvevrfuijjxsqqlt.supabase.co/functions/v1/shared-portfolio',
          {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ token: token })
          }
        );

        if (!res.ok) {
          var errData = await res.json().catch(function() { return {}; });
          renderError(errData.deactivated ? 'deactivated' : 'notfound');
          return;
        }

        var data = await res.json();
        if (!data || !data.portfolio || data.portfolio.length === 0) {
          renderError('notfound');
          return;
        }
        renderContent(data);
      } catch (e) {
        renderError('notfound');
      }
    }

    load();
  </script>
</body>
</html>
