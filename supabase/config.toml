project_id = "trqqcvevrfuijjxsqqlt"

# Called only by the signed-in Grovio owner account.
[functions.marketing-admin]
enabled = true
verify_jwt = true
import_map = "./functions/marketing-admin/deno.json"
entrypoint = "./functions/marketing-admin/index.ts"

# Instagram returns here with an HMAC-signed, time-limited OAuth state. It
# cannot use Supabase's JWT gate because Instagram is the caller.
[functions.marketing-meta-oauth]
enabled = true
verify_jwt = false
entrypoint = "./functions/marketing-meta-oauth/index.ts"

# TikTok, X, and Reddit use a short-lived state stored server-side. Their
# callback cannot have Supabase's JWT gate because the platform calls it.
[functions.marketing-channel-oauth]
enabled = true
verify_jwt = false
entrypoint = "./functions/marketing-channel-oauth/index.ts"
