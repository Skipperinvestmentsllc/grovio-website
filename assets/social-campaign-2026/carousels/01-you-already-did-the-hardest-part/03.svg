  <text x="540" y="549" text-anchor="middle" fill="#2C2218" font-family="'Source Serif 4', Georgia, serif" font-size="54" font-weight="400" font-style="normal" letter-spacing="-1.4">Begin with today,</text>
    <text x="540" y="610" text-anchor="middle" fill="#2C2218" font-family="'Source Serif 4', Georgia, serif" font-size="54" font-weight="400" font-style="normal" letter-spacing="-1.4">not every possible task.</text>
    <text x="540" y="671" text-anchor="middle" fill="#B96E4A" font-family="'Source Serif 4', Georgia, serif" font-size="54" font-weight="400" font-style="italic" letter-spacing="-1.4">Five minutes a day. No</text>
    <text x="540" y="732" text-anchor="middle" fill="#B96E4A" font-family="'Source Serif 4', Georgia, serif" font-size="54" font-weight="400" font-style="italic" letter-spacing="-1.4">streaks, no guilt.</text>
