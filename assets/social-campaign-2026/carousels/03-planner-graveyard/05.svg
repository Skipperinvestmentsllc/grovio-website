  <line x1="492" y1="1108" x2="588" y2="1108" stroke="#4A6E4E" stroke-width="3" stroke-linecap="round" opacity="0.8"/>
  <text x="540" y="1202" text-anchor="middle" fill="#B96E4A" font-family="Nunito, Arial, sans-serif" font-size="44" font-weight="800" letter-spacing="-2">grovio</text>
