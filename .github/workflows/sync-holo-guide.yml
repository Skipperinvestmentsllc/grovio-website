name: Sync approved Holo Guide articles

on:
  schedule:
    - cron: "17 */2 * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: holo-guide-publishing-main
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - name: Check out the website
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Sync approved Holo articles
        run: node scripts/sync-holo-guide-feed.mjs
      - name: Build Guide pages
        run: node scripts/publish-holo-guide-article.mjs
      - name: Commit synced Guide pages
        run: |
          git add -A -- .github guide sitemap.xml
          if git diff --cached --quiet; then
            exit 0
          fi
          git config user.name "grovio publishing"
          git config user.email "actions@github.com"
          git commit -m "Sync approved Holo Guide articles"
          git push
