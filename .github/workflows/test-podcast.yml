name: Podcast publishing checks
on:
  push:
    paths: ['scripts/*podcast*.mjs', 'content/podcast/**', '.github/workflows/test-podcast.yml']
  pull_request:
    paths: ['scripts/*podcast*.mjs', 'content/podcast/**', '.github/workflows/test-podcast.yml']
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: node --test scripts/test-podcast-publishing.mjs
